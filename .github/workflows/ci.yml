name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize MCAP submodule
        run: git submodule update --init --depth 1 third_party/mcap

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang-format clang-tidy cpplint libwebsockets-dev nlohmann-json3-dev

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev

      - name: Check formatting
        run: |
          find apps include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Run cpplint
        run: python3 -m cpplint --recursive apps include src tests

      - name: Run clang-tidy
        run: |
          cmake -S . -B build/tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build/tidy --parallel

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: .githooks/check-commit-range "origin/${{ github.base_ref }}..HEAD"
