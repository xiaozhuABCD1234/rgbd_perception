syntax = "proto3";

package foxglove;

import "google/protobuf/timestamp.proto";

message CameraCalibration {
  google.protobuf.Timestamp timestamp = 1;
  fixed32 width = 2;
  fixed32 height = 3;
  string distortion_model = 4;
  repeated double D = 5;
  repeated double K = 6;
  repeated double R = 7;
  repeated double P = 8;
  string frame_id = 9;
}
